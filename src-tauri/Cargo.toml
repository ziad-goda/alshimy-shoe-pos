[package]
name = "al-shimy-pos"
version = "1.0.0"
description = "AL SHIMY — Offline POS & Inventory (Tauri v2)"
authors = ["AL SHIMY"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "al_shimy_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-sql = { version = "2.2", features = ["sqlite"] }
tauri-plugin-fs = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
